<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA APOD Search</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="container py-5">
    <h1 class="text-center mb-4">NASA Astronomy Picture of the Day</h1>

    <form id="search-form" class="d-flex flex-column flex-md-row justify-content-center gap-3 mb-5">
      <input type="date" id="date" name="date" class="form-control" required />
      <button type="submit" class="btn btn-primary">Get Picture</button>
    </form>

    <section id="apod-container" class="mb-5"></section>

    <h2 class="mb-3">Favourites</h2>
    <section id="favourites-container" class="row row-cols-1 row-cols-md-2 g-4"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
